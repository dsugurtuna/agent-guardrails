name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,anthropic]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type-check (strict)
        run: mypy
      - name: Test (offline, no API keys)
        run: pytest
      - name: Run the offline example
        run: python examples/email_calendar_assistant.py

  core-only:
    # The core library must work without the optional Anthropic SDK installed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install without extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest hypothesis
      - name: Test
        run: pytest
